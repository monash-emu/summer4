name: Coverage audit (temporary)

# Temporary: measures what each example notebook covers that the rest of the
# suite does not. Removed before the PR is merged.

on:
  push:
    branches: [chore/notebook-ci-audit]

jobs:
  cov:
    strategy:
      fail-fast: false
      matrix:
        part: [suite, notebooks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          environments: default
          cache: true
          locked: true
      - run: pip install uv && uv pip install --python "$(pixi run -e default python -c 'import sys; print(sys.executable)')" pytest-cov
      - if: matrix.part == 'suite'
        run: pixi run -e default pytest tests/ benchmarks/test_bench_tb_scale.py -q --deselect tests/test_notebooks.py::test_notebook_executes --cov=summer4 --cov-branch --cov-context=test --cov-report=
      - if: matrix.part == 'notebooks'
        run: pixi run -e default pytest tests/test_notebooks.py -q --durations=0 --cov=summer4 --cov-branch --cov-context=test --cov-report=
      - run: mv .coverage cov-${{ matrix.part }}.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: cov-${{ matrix.part }}
          path: cov-${{ matrix.part }}.sqlite
          include-hidden-files: true
