name: Nightly

# Forward-compatibility tests against current JAX (the `latest` pixi
# environment). These used to run on every pull request; they now run once a
# night on main, and on demand. GitHub runs scheduled workflows only from the
# default branch.

on:
  schedule:
    - cron: "17 15 * * *" # 15:17 UTC, early morning in Melbourne
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-latest:
    name: Test (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          environments: latest
          cache: true
          locked: true
      - run: pixi run --environment latest test
