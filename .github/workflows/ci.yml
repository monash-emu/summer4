name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which CI suite to run
        type: choice
        options:
          - quick
          - full
        default: full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'quick')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          cache: true
          cache-write: ${{ github.ref_name == 'main' }}
          locked: true
      - run: pixi run lint
      - run: pixi run format-check
      - run: pixi run test-quick

  quality:
    name: Quality
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          cache: true
          locked: true
      - run: pixi run lint
      - run: pixi run format-check
      - run: pixi run check-notebooks
      - run: pixi run check-branch -- --base origin/${{ github.base_ref || 'main' }}

  # The `latest` (current JAX) environment runs nightly instead: see nightly.yml.
  # Slow example notebooks run in the parallel "Notebooks" job below, not here.
  test:
    name: Test (default)
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          environments: default
          cache: true
          locked: true
      - run: pixi run --environment default test

  # Executes the slow example notebooks, in parallel with "Test (default)". On a
  # pull request it runs only when the PR touches code or files a notebook can
  # depend on; a docs- or plans-only PR skips it. The smoke notebooks run in
  # every test suite regardless, and nightly.yml runs all of them on main.
  # Each notebook has its own time budget (tests/test_notebooks.py).
  notebooks:
    name: Notebooks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether notebooks need to run
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"; exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "${changed}"
          pattern='^(src/|examples/notebooks/|tests/test_notebooks\.py$|tests/gate_|tests/helpers/|pixi\.(toml|lock)$|pyproject\.toml$|\.github/workflows/ci\.yml$)'
          if grep -qE "${pattern}" <<< "${changed}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No notebook-relevant changes; skipping slow notebooks."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          environments: default
          cache: true
          locked: true
      - if: steps.gate.outputs.run == 'true'
        run: pixi run --environment default test-notebooks

  # Native Windows (x86_64, CPU). Runs on every push so a branch can be checked on
  # Windows without a Windows machine. Quick suite only: slow notebook and
  # TB-scale benches stay on Linux.
  windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          environments: default
          cache: true
          cache-write: ${{ github.ref_name == 'main' }}
          locked: true
      - run: pixi run --environment default test-quick

  # Not the repo's pixi.toml. That install is editable
  # (`summer4 = { path = ".", editable = true }`) and will not notice a
  # dependency missing from the wheel. This job builds a scratch project that
  # pins the git tag, the way a downstream repository does.
  downstream-smoke:
    name: Downstream smoke
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          run-install: false
          cache: false
      - name: Install the tagged release into a scratch project
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/summer4-smoke"
          mkdir -p "${scratch}"
          cat > "${scratch}/pixi.toml" <<'EOF'
          [workspace]
          channels = ["conda-forge"]
          name = "summer4-downstream-smoke"
          platforms = ["linux-64"]

          [dependencies]
          python = "3.13.*"

          [pypi-dependencies]
          summer4 = { git = "https://github.com/monash-emu/summer4.git", tag = "v0.2.0a6" }
          EOF
          cd "${scratch}"
          pixi install
          SUMMER4_SMOKE_REQUIRE_INSTALL=1 pixi run python "${GITHUB_WORKSPACE}/scripts/downstream_smoke.py"

  # Reviewers download this artifact to read the built site before merge.
  docs:
    name: Docs build
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          environments: docs
          cache: true
          locked: true
      - run: pixi run -e docs docs-strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
