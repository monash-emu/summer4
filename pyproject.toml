[project]
name = "summer4"
version = "0.2.0a4"
description = "JAX-native compartmental modelling platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Monash EMU" }]
dependencies = [
    "numpy>=1.26",
    "jax>=0.6.0",
    "jaxlib>=0.6.0",
    "diffrax>=0.7.2",
    "equinox",
]

[project.optional-dependencies]
# Compatibility alias for one release. These packages are already core
# dependencies; `pip install summer4[jax]` still installs them.
jax = [
    "jax>=0.6.0",
    "jaxlib>=0.6.0",
    "diffrax>=0.7.2",
    "equinox",
]
calibration = [
    "numpyro>=0.16.0",
    "optax>=0.2.0",
    "arviz>=0.20.0",
]
pandas = [
    "pandas>=2.0",
]
frames = [
    "polars>=1.0",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summer4"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "benchmarks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = """
/(
  \\.pixi
  | \\.ipynb_checkpoints
)/
"""

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["summer4"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["summer4"]
branch = true
