[project]
name = "summer4"
version = "0.1.0a0"
description = "JAX-native compartmental modelling platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Monash EMU" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
jax = [
    "jax>=0.6.0",
    "jaxlib>=0.6.0",
    "diffrax>=0.7.2",
]
calibration = [
    "numpyro>=0.16.0",
    "optax>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summer4"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "benchmarks", "scripts", "explorations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"explorations/**/*.ipynb" = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["summer4"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["summer4"]
branch = true
