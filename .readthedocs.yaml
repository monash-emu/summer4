# Read the Docs configuration for summer4
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  commands:
    - pip install pixi
    - pixi install -e docs
    - pixi run -e docs docs

sphinx:
  configuration: docs/conf.py

formats: []

python:
  install:
    - method: pip
      path: .
