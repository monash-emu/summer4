[workspace]
channels = ["conda-forge"]
name = "summer4"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[pypi-dependencies]
summer4 = { path = ".", editable = true }

[feature.jax06.dependencies]
python = "3.13.*"

[feature.jax06.pypi-dependencies]
jax = ">=0.6,<0.7"
jaxlib = ">=0.6,<0.7"
diffrax = ">=0.7.2,<0.8"
numpyro = ">=0.16.0,<0.17"
optax = ">=0.2.0"

[feature.jaxlatest.dependencies]
python = "3.13.*"

[feature.jaxlatest.pypi-dependencies]
jax = "*"
jaxlib = "*"
diffrax = "*"
numpyro = "*"
optax = "*"

[feature.docs.dependencies]
python = "3.13.*"

[feature.docs.pypi-dependencies]
sphinx = ">=8.0,<9"
myst-nb = ">=1.1"
myst-parser = ">=4.0"
pydata-sphinx-theme = ">=0.16"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinxcontrib-mermaid = "*"
sphinx-autodoc-typehints = "*"
jupyter-cache = "*"
linkify-it-py = "*"
ipykernel = ">=6.29"
matplotlib = ">=3.8"
# The flows-spike notebooks in docs/dev/flows/ exercise the JAX backend
# and plot with Polars + Plotly.
jax = ">=0.6,<0.7"
jaxlib = ">=0.6,<0.7"
polars = ">=1.0"
plotly = ">=5.24"

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-benchmark = "*"
hypothesis = "*"
ruff = "*"
mypy = "*"
black = "*"
ipykernel = ">=6.29"
ipywidgets = ">=8.1"
matplotlib = ">=3.8"
polars = ">=1.0"
pyarrow = ">=17.0"
plotly = ">=5.24"
nbformat = ">=5.10"

[feature.notebooks.dependencies]
jupyterlab = ">=4.0"

[environments]
default = ["jax06", "dev"]
latest = ["jaxlatest", "dev"]
nb = ["jax06", "notebooks", "dev"]
docs = ["docs"]

[tasks]
setup = { cmd = "python scripts/setup_hooks.py", description = "Install git hooks (Black format, cleared notebooks, plan copy)" }
register-kernel = { cmd = "python -m ipykernel install --user --name summer4 --display-name 'Python (summer4)'", description = "Register the default env as a Jupyter kernel for VS Code/Cursor" }
check-branch = { cmd = "python scripts/check_feature_branch.py", description = "Require tests, a notebook, and a plan on feature branches that change src/" }
test = { cmd = "pytest tests/ -v", description = "Run unit, property, and notebook smoke tests" }
test-all = { cmd = "pixi run --environment default test && pixi run --environment latest test", description = "Run tests in every JAX environment" }
lint = { cmd = "ruff check src tests benchmarks scripts explorations && mypy src/summer4", description = "Lint and type-check" }
format = { cmd = "black src tests benchmarks scripts explorations", description = "Format Python with Black (line length 100)" }
format-check = { cmd = "black --check src tests benchmarks scripts explorations", description = "Check Black formatting" }
explore-flows = { cmd = "pytest tests/test_explore_flows.py -v", description = "Run the explore-flows spike tests and notebook" }
check-notebooks = { cmd = "python scripts/check_cleared_notebooks.py", description = "Require committed notebooks to have cleared outputs" }
bench = { cmd = "pytest benchmarks/ --benchmark-only -v --benchmark-columns=min,max,median,ops", description = "Run taxonomy benchmarks in the current env" }
bench-json = { cmd = "python scripts/bench_json.py", description = "Write benchmark JSON keyed by JAX version" }
docs = { cmd = "sphinx-build -b html docs docs/_build/html", env = { PYTHONPATH = "." }, description = "Build the HTML documentation" }
docs-strict = { cmd = "sphinx-build -b html -W --keep-going docs docs/_build/html", env = { PYTHONPATH = "." }, description = "Build docs with warnings as errors" }
docs-clean = { cmd = "rm -rf docs/_build", description = "Remove documentation build artifacts" }
docs-serve = { cmd = "python -m http.server -d docs/_build/html 8765", description = "Serve built documentation locally" }
notebook = { cmd = "jupyter lab examples/notebooks", description = "Launch JupyterLab on the example notebooks" }
